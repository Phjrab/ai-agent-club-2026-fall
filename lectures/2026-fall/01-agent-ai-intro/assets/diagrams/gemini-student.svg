<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 Z" fill="#8290a4"/></marker></defs><rect width="100%" height="100%" rx="30" fill="url(#wash)"/><text x="54" y="52" fill="#2657c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">AI 에이전트 동아리 · 1회차</text><text x="54" y="105" fill="#111827" font-family="Pretendard,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start">제공 페이지의 Google AI Plus 학생 혜택 안내</text><text x="54" y="145" fill="#647084" font-family="Pretendard,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="start">제공된 한국 구독 페이지에 학생 1년 무료 프로모션과 종료 임박 안내가 표시됨. 신청 자격·정확한 기한은 별도 확인 필요.</text><rect x="70" y="205" width="1060" height="350" rx="28" fill="#10234b" stroke="#10234b" stroke-width="2"/><circle cx="185" cy="320" r="62" fill="#ffd166"/><text x="185" y="338" fill="#10234b" font-family="Pretendard,Arial,sans-serif" font-size="56" font-weight="700" text-anchor="middle">1</text><text x="285" y="270" fill="#a8c8ff" font-family="Pretendard,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">학생 프로모션 · Google AI Plus</text><text x="285" y="330" fill="#fff" font-family="Pretendard,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="start">학생 1년 무료 혜택 표시</text><text x="285" y="380" fill="#e6edff" font-family="Pretendard,Arial,sans-serif" font-size="24" font-weight="500" text-anchor="start">상단 배너에 프로모션 종료 임박 안내가 표시됨</text><text x="285" y="420" fill="#c8d5ed" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">정확한 마감일과 개인 자격은 확인되지 않음</text><rect x="115" y="590" width="970" height="90" rx="18" fill="#fff" stroke="#dce2ec" str