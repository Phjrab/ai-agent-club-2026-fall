<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 Z" fill="#8290a4"/></marker></defs><rect width="100%" height="100%" rx="30" fill="url(#wash)"/><text x="54" y="52" fill="#2657c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">AI 에이전트 동아리 · 1회차</text><text x="54" y="105" fill="#111827" font-family="Pretendard,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start">오케스트레이션은 작업과 검토 순서를 정리</text><text x="54" y="145" fill="#647084" font-family="Pretendard,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="start">자료 조사, 작성·렌더링, 검수·수정 사이의 순서와 되돌림. 실제 병렬 모델 실행을 주장하지 않음.</text><rect x="65" y="250" width="305" height="250" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="65" y="250" width="9" height="250" rx="4" fill="#2657c8"/><text x="93" y="292" fill="#2657c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">자료 조사</text><text x="93" y="336" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">출처를 모은다</text><text x="93" y="382" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">확인된 점과 미확인 점</text><path d="M380 375 L445 375" fill="none" stroke="#8290a4" stroke-width="4" marker-end="url(#arrow)"/><rect x="465" y="250" width="305" height="250" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="465" y="250" width="9" height="250" rx="4" fill="#6b54c8"/><text x="493" y="292" fill="#6b54c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">작성·렌더링</text><text x="493" y="336" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">초안을 만든다</text><text x="493" y="382" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">기획 조건을 지킨다</text><path d="M780 375 L845 375" fill="none" stroke="#8290a4" stroke-width="4" marker-end="url(#arrow)"/><rect x="865" y="250" width="270" height="250" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="865" y="250" width="9" height="250" rx="4" fill="#1c8d68"/><text x="893" y="292" fill="#1c8d68" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">화면 검수</text><text x="893" y="336" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">슬라이드를 살핀다</text><text x="893" y="382" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">통과 또는 수정</text><path d="M1000 530 C980 650 570 660 570 520" fill="none" stroke="#c27442" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="600" y="650" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle">오케스트레이션은 한 작업자 또는 여러 작업자의 흐름을 정리할 수 있습니다.</text></svg>
