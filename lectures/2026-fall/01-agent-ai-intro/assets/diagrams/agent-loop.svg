amily="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">도구 사용</text><text x="428" y="417" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">읽기 또는 수정</text><path d="M635 395 L720 395" fill="none" stroke="#8290a4" stroke-width="4" marker-end="url(#arrow)"/><rect x="735" y="285" width="225" height="220" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="735" y="285" width="9" height="220" rx="4" fill="#1c8d68"/><text x="763" y="327" fill="#1c8d68" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">관찰</text><text x="763" y="371" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">결과 확인</text><text x="763" y="417" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">실행 결과로 판단</text><path d="M970 395 L1030 395" fill="none" stroke="#8290a4" stroke-width="4" marker-end="url(#arrow)"/><rect x="995" y="285" width="150" height="220" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="995" y="285" width="9" height="220" rx="4" fill="#c27442"/><text x="1023" y="327" fill="#c27442" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">통과?</text><text x="1023" y="371" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">판단</text><text x="1023" y="417" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">종료 또는 수정</text><path d="M1065 525 C1065 650 515 670 510 525" fill="none" stroke="#c27442" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="740" y="650" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle">실패하면 정한 횟수 안에서 수정 · 민감한 행동은 먼저 확인</text></svg>
