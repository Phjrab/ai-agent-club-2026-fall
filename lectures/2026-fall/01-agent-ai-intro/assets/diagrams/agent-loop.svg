<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 Z" fill="#8290a4"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="55" y="38" width="1090" height="88" rx="18" fill="#f4f6fb" stroke="#dce2ec" stroke-width="2"/><text x="600" y="94" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle">가상 사례 · 저장을 눌렀지만 결과 파일이 없음</text><rect x="45" y="200" width="320" height="240" rx="24" fill="#eff5ff" stroke="#d8e2f5" stroke-width="2"/><text x="205" y="245" fill="#2657c8" font-family="Pretendard,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">실행</text><text x="205" y="320" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle">저장 버튼 클릭</text><text x="205" y="370" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="25" font-weight="500" text-anchor="middle">같은 입력으로 시작</text><path d="M376 320 L425 320" fill="none" stroke="#8290a4" stroke-width="5" marker-end="url(#arrow)"/><rect x="440" y="200" width="320" height="240" rx="24" fill="#fff4eb" stroke="#f2dcc7" stroke-width="2"/><text x="600" y="245" fill="#b36c31" font-family="Pretendard,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">관찰</text><text x="600" y="320" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="33" font-weight="700" text-anchor="middle">결과 파일이 없음</text><text x="600" y="370" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="25" font-weight="500" text-anchor="middle">검수 기준을 통과하지 못함</text><path d="M772 320 L821 320" fill="none" stroke="#8290a4" stroke-width="5" marker-end="url(#arrow)"/><rect x="835" y="200" width="320" height="240" rx="24" fill="#f5f1ff" stroke="#e0d8f4" stroke-width="2"/><text x="995" y="245" fill="#6b54c8" font-family="Pretendard,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">수정 후보</text><text x="995" y="320" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">이벤트 연결</text><text x="995" y="370" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="25" font-weight="500" text-anchor="middle">저장 경로 · 쓰기 권한</text><path d="M1010 465 C1010 535 600 548 190 465" fill="none" stroke="#c27442" stroke-width="6" marker-end="url(#arrow)"/><text x="600" y="584" fill="#a75c24" font-family="Pretendard,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">수정 후 같은 조건으로 재검사</text><rect x="60" y="632" width="500" height="112" rx="18" fill="#eef8f2" stroke="#cfe8d7" stroke-width="2"/><text x="310" y="675" fill="#1c8d68" font-family="Pretendard,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">기준 통과</text><text x="310" y="716" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="25" font-weight="500" text-anchor="middle">파일과 내용을 확인한 뒤 종료</text><rect x="640" y="632" width="500" height="112" rx="18" fill="#fff5e9" stroke="#f1d9bd" stroke-width="2"/><text x="890" y="675" fill="#a75c24" font-family="Pretendard,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle">권한 승인 · 재시도 한도</text><text x="890" y="716" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="25" font-weight="500" text-anchor="middle">사람에게 묻고 멈춤</text></svg>
