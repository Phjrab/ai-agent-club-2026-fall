<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 Z" fill="#8290a4"/></marker></defs><rect width="100%" height="100%" rx="30" fill="url(#wash)"/><text x="54" y="52" fill="#2657c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">AI 에이전트 동아리 · 1회차</text><text x="54" y="105" fill="#111827" font-family="Pretendard,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start">CSU AI 이용 경로 설명</text><text x="54" y="145" fill="#647084" font-family="Pretendard,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="start">학교 포털에서 CSU AI로 이동해 계정에서 제공되는 모델을 확인하는 개념 경로. 실제 학교 메뉴 화면이 아님.</text><rect x="65" y="260" width="300" height="250" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="65" y="260" width="9" height="250" rx="4" fill="#2657c8"/><text x="93" y="302" fill="#2657c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">1 · 접속</text><text x="93" y="346" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">조선대학교 포털</text><text x="93" y="392" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">학교 계정으로 로그인</text><path d="M380 385 L465 385" fill="none" stroke="#8290a4" stroke-width="4" marker-end="url(#arrow)"/><rect x="475" y="260" width="300" height="250" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="475" y="260" width="9" height="250" rx="4" fill="#6b54c8"/><text x="503" y="302" fill="#6b54c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">2 · 이동</text><text x="503" y="346" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">CSU AI / BAZE</text><text x="503" y="392" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">계정·정책에 따라</text><text x="503" y="428" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">화면이 달라질 수 있음</text><path d="M790 385 L875 385" fill="none" stroke="#8290a4" stroke-width="4" marker-end="url(#arrow)"/><rect x="885" y="260" width="250" height="250" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="885" y="260" width="9" height="250" rx="4" fill="#1c8d68"/><text x="913" y="302" fill="#1c8d68" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">3 · 선택</text><text x="913" y="346" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">사용 가능 모델</text><text x="913" y="392" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">계정과 크레딧이</text><text x="913" y="428" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">선택 범위를 정함</text><text x="600" y="615" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle">학교 이용 경로 설명도 · 실제 포털 화면 아님</text></svg>
