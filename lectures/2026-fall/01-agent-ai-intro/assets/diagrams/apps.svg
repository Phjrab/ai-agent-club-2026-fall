<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 Z" fill="#8290a4"/></marker></defs><rect width="100%" height="100%" rx="30" fill="url(#wash)"/><text x="54" y="52" fill="#2657c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">AI 에이전트 동아리 · 1회차</text><text x="54" y="105" fill="#111827" font-family="Pretendard,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start">웹과 데스크톱의 서로 다른 작업 환경</text><text x="54" y="145" fill="#647084" font-family="Pretendard,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="start">웹과 데스크톱 작업 환경의 차이를 설명하는 개념도. 실제 제품 UI 캡처나 속도 비교가 아님.</text><rect x="65" y="250" width="400" height="295" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="65" y="250" width="9" height="295" rx="4" fill="#2657c8"/><text x="93" y="292" fill="#2657c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">웹</text><text x="93" y="336" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">대화와 연결 자료</text><text x="93" y="382" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">브라우저 작업 환경</text><rect x="735" y="250" width="400" height="295" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="735" y="250" width="9" height="295" rx="4" fill="#6b54c8"/><text x="763" y="292" fill="#6b54c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">데스크톱 앱</text><text x="763" y="336" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">프로젝트 모드와 로컬 파일</text><text x="763" y="382" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">지원되는 모드와</text><text x="763" y="418" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">권한이 있을 때만</text><path d="M470 400 L720 400" fill="none" stroke="#8290a4" stroke-width="3" /><text x="600" y="625" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle">작업 환경에 따라 흐름은 달라지지만 모델 품질 순위가 되지는 않습니다.</text><text x="600" y="660" fill="#647084" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle">설명용 비교도 · 실제 제품 화면 아님</text></svg>
