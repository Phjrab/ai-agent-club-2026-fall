<text x="463" y="367" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">선택 이유와 범위</text><rect x="810" y="235" width="330" height="220" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="810" y="235" width="9" height="220" rx="4" fill="#1c8d68"/><text x="838" y="277" fill="#1c8d68" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">AI 역할</text><text x="838" y="321" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">무엇을 맡겼나?</text><text x="838" y="367" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">사람의 검토를 드러냄</text><rect x="250" y="510" width="330" height="170" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="250" y="510" width="9" height="170" rx="4" fill="#c27442"/><text x="278" y="552" fill="#c27442" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">검증 근거</text><text x="278" y="596" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">무엇을 확인했나?</text><text x="278" y="642" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">화면과 검사 결과</text><rect x="625" y="510" width="330" height="170" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="625" y="510" width="9" height="170" rx="4" fill="#647084"/><text x="653" y="552" fill="#647084" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">한계</text><text x="653" y="596" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">무엇이 남았나?</text><text x="653" y="642" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">미확인 사항과 다음 단계</text></svg>
