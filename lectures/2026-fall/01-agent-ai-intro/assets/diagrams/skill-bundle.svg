<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 Z" fill="#8290a4"/></marker></defs><rect width="100%" height="100%" rx="30" fill="url(#wash)"/><text x="54" y="52" fill="#2657c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">AI 에이전트 동아리 · 1회차</text><text x="54" y="105" fill="#111827" font-family="Pretendard,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start">재사용 Skill의 지원되는 진입점</text><text x="54" y="145" fill="#647084" font-family="Pretendard,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="start">SKILL.md와 참고 자료·스크립트가 호스트 지원을 통해 작업 방법으로 적용되는 관계.</text><rect x="70" y="220" width="365" height="390" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><text x="110" y="270" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start">/skill-folder</text><text x="120" y="335" fill="#2657c8" font-family="Pretendard,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">SKILL.md</text><text x="150" y="380" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="start">재사용할 작업 방법과 규칙</text><text x="120" y="445" fill="#6b54c8" font-family="Pretendard,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">references/</text><text x="150" y="490" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="start">작업별 참고 자료</text><text x="120" y="555" fill="#1c8d68" font-family="Pretendard,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">scripts/</text><text x="150" y="590" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">지원되는 경우 반복 검사</text><path d="M460 420 L580 420" fill="none" stroke="#8290a4" stroke-width="4" marker-end="url(#arrow)"/><rect x="600" y="270" width="520" height="300" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="600" y="270" width="9" height="300" rx="4" fill="#6b54c8"/><text x="628" y="312" fill="#6b54c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">호스트 지원</text><text x="628" y="356" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">불러와 적용</text><text x="628" y="402" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">지원되는 진입 파일</text><text x="628" y="438" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">호스트가 지원하는 경우에만</text><text x="600" y="660" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle">Markdown 파일만 있다고 Skill이 자동으로 적용되지는 않습니다.</text></svg>
