<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 Z" fill="#8290a4"/></marker></defs><rect width="100%" height="100%" rx="30" fill="url(#wash)"/><text x="54" y="52" fill="#2657c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">AI 에이전트 동아리 · 1회차</text><text x="54" y="105" fill="#111827" font-family="Pretendard,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start">모델은 에이전트 시스템의 한 구성 요소</text><text x="54" y="145" fill="#647084" font-family="Pretendard,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="start">LLM의 응답 생성과 에이전트 시스템의 도구·상태·검증 작업 역할을 비교.</text><rect x="65" y="255" width="430" height="300" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="65" y="255" width="9" height="300" rx="4" fill="#1c8d68"/><text x="93" y="297" fill="#1c8d68" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">대규모 언어 모델(LLM)</text><text x="93" y="341" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">생성</text><text x="93" y="387" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">언어</text><text x="93" y="423" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">다음 행동 후보</text><path d="M520 405 L665 405" fill="none" stroke="#8290a4" stroke-width="4" marker-end="url(#arrow)"/><rect x="690" y="225" width="445" height="360" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="690" y="225" width="9" height="360" rx="4" fill="#6b54c8"/><text x="718" y="267" fill="#6b54c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">에이전트 시스템</text><text x="718" y="311" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">목표를 향해 작업</text><text x="718" y="357" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">모델 + 도구 + 상태</text><text x="718" y="393" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">실행 결과 관찰</text><text x="718" y="429" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">경계에서 멈추거나 질문</text><text x="600" y="650" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle">에이전트는 LLM을 사용할 수 있으며 서로 다른 층위를 가리키는 말입니다.</text></svg>
