<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 Z" fill="#8290a4"/></marker></defs><rect width="100%" height="100%" rx="30" fill="url(#wash)"/><text x="54" y="52" fill="#2657c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">AI 에이전트 동아리 · 1회차</text><text x="54" y="105" fill="#111827" font-family="Pretendard,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start">GPT는 모델 계열, ChatGPT와 Codex는 제품·작업 환경</text><text x="54" y="145" fill="#647084" font-family="Pretendard,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="start">GPT 모델 계열, ChatGPT 대화 서비스, Codex 코딩 환경의 관계. 실제 제품 화면이 아닌 설명용 도식.</text><rect x="65" y="230" width="310" height="300" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="65" y="230" width="9" height="300" rx="4" fill="#1c8d68"/><text x="93" y="272" fill="#1c8d68" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">모델 계열</text><text x="93" y="316" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">GPT 모델</text><text x="93" y="362" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">응답 문장을 만들고</text><text x="93" y="398" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">다음 행동을 제안한다</text><path d="M390 380 L465 380" fill="none" stroke="#8290a4" stroke-width="4" marker-end="url(#arrow)"/><rect x="470" y="230" width="310" height="300" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="470" y="230" width="9" height="300" rx="4" fill="#2657c8"/><text x="498" y="272" fill="#2657c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">대화 서비스</text><text x="498" y="316" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">ChatGPT</text><text x="498" y="362" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">대화와</text><text x="498" y="398" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">지원되는 작업 모드</text><path d="M795 380 L870 380" fill="none" stroke="#8290a4" stroke-width="4" marker-end="url(#arrow)"/><rect x="875" y="230" width="260" height="300" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="875" y="230" width="9" height="300" rx="4" fill="#6b54c8"/><text x="903" y="272" fill="#6b54c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">코딩 작업 도구</text><text x="903" y="316" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">Codex</text><text x="903" y="362" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">코딩 에이전트</text><text x="903" y="398" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">환경</text><path d="M625 545 V610 H1000 V545" fill="none" stroke="#b6c0ce" stroke-dasharray="9 9" stroke-width="3"/><text x="810" y="650" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="middle">제품과 요금제는 계정·사용 모드에 따라 달라질 수 있음</text></svg>
