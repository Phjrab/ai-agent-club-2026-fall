<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 Z" fill="#8290a4"/></marker></defs><rect width="100%" height="100%" rx="30" fill="url(#wash)"/><text x="54" y="52" fill="#2657c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">AI 에이전트 동아리 · 1회차</text><text x="54" y="105" fill="#111827" font-family="Pretendard,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start">저장·공개 전에 변경 내용을 검토</text><text x="54" y="145" fill="#647084" font-family="Pretendard,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="start">파일 변경, diff 확인, commit, PR 검토의 역할을 설명. 이 자료는 공개 허가나 승인 기록의 증거가 아님.</text><rect x="45" y="270" width="210" height="250" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="45" y="270" width="9" height="250" rx="4" fill="#647084"/><text x="73" y="312" fill="#647084" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">작업 폴더</text><text x="73" y="356" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">파일 수정</text><text x="73" y="402" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">로컬 작업 상태</text><path d="M265 395 L310 395" fill="none" stroke="#8290a4" stroke-width="4" marker-end="url(#arrow)"/><rect x="325" y="270" width="210" height="250" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="325" y="270" width="9" height="250" rx="4" fill="#2657c8"/><text x="353" y="312" fill="#2657c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">변경 비교(diff)</text><text x="353" y="356" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">바뀐 내용 검토</text><text x="353" y="402" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">무엇이 달라졌나?</text><path d="M545 395 L590 395" fill="none" stroke="#8290a4" stroke-width="4" marker-end="url(#arrow)"/><rect x="605" y="270" width="210" height="250" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="605" y="270" width="9" height="250" rx="4" fill="#1c8d68"/><text x="633" y="312" fill="#1c8d68" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">커밋(commit)</text><text x="633" y="356" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">변경을 기록</text><text x="633" y="402" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">되돌아볼 기준점</text><path d="M825 395 L870 395" fill="none" stroke="#8290a4" stroke-width="4" marker-end="url(#arrow)"/><rect x="885" y="270" width="250" height="250" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/><rect x="885" y="270" width="9" height="250" rx="4" fill="#6b54c8"/><text x="913" y="312" fill="#6b54c8" font-family="Pretendard,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">풀 리퀘스트(PR)</text><text x="913" y="356" fill="#18202d" font-family="Pretendard,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">논의·검토</text><text x="913" y="402" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">준비되면 합치기</text><text x="600" y="630" fill="#536071" font-family="Pretendard,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="middle">비밀·이용 조건·공개 승인을 확인한 뒤 포트폴리오로 공개합니다.</text></svg>
